.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}

.add:disabled{background:#b6bfca;cursor:not-allowed}
.empty{color:var(--muted)}
footer{background:var(--deep);color:#c7d2e0;text-align:center;padding:32px 16px 90px;display:flex;flex-direction:column;align-items:center;gap:14px}
