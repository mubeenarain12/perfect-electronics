<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfect Electronics & Solar System</title>
<meta name="description" content="Electronics and solar products. Add to cart and order on WhatsApp.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#0e2238;--sun:#f2a31b;--bg:#f4f6f8;--card:#fff;--text:#18222e;--muted:#667282;--line:#dde3ea}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
button{font:inherit}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:1.05rem}
.cartbtn{background:var(--sun);color:#1a1405;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.hero{background:var(--ink);color:#fff;padding:8px 16px 28px}
.hero div{max-width:1100px;margin:auto}
.hero h1{margin:0 0 6px;font-size:clamp(1.4rem,4vw,2.1rem);line-height:1.2;max-width:22ch}
.hero p{margin:0;color:#b9c6d6}
main{max-width:1100px;margin:auto;padding:18px 16px 32px}
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
#search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:150px;background:#e9eef4;display:flex;align-items:center;justify-content:center;font-size:3rem}
.pic img{width:100%;height:100%;object-fit:cover}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:600}
.cat{color:var(--muted);font-size:.85rem}
.price{font-weight:700;color:var(--ink);margin-bottom:6px}
.add{margin-top:auto;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:10px;cursor:pointer;font-weight:600}
.add:disabled{background:#b6bfca;cursor:not-allowed}
.empty{color:var(--muted)}
footer{text-align:center;color:var(--muted);padding:20px 16px;font-size:.9rem}
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:#fff;z-index:11;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.dhead button{border:0;background:none;font-size:1.4rem;cursor:pointer}
#items{flex:1;overflow:auto;padding:6px 16px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:1.1rem}
#checkout{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#checkout input,#checkout textarea{padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;width:100%}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem}
.send{background:#1fa855;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
.note{margin:0;color:var(--muted);font-size:.85rem}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<header><div class="bar"><div class="brand">⚡ <span id="brand">Perfect Electronics & Solar System</span></div><button class="cartbtn" id="cartbtn">Cart (<span id="count">0</span>)</button></div></header>
<section class="hero"><div><h1>Electronics and solar products, ordered on WhatsApp</h1><p>Add items to your cart and send your order. Payment: Cash on Delivery.</p></div></section>
<main>
  <div class="tools"><input id="search" type="search" placeholder="Search products, e.g. solar panel" aria-label="Search"><div class="chips" id="chips"></div></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Perfect Electronics & Solar System</footer>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Cart">
  <div class="dhead"><span>Your cart</span><button id="close" aria-label="Close">×</button></div>
  <div id="items"></div>
  <form id="checkout" hidden>
    <div class="total"><span>Total</span><span id="total">Rs 0</span></div>
    <input id="cname" required placeholder="Your name" autocomplete="name">
    <input id="cphone" required type="tel" placeholder="Phone number" autocomplete="tel">
    <textarea id="caddr" required rows="2" placeholder="Full address"></textarea>
    <button class="send" type="submit">Send order on WhatsApp</button>
    <p class="note">WhatsApp will open with your order already written. Just tap Send.</p>
    <button class="link" type="button" id="clear">Clear cart</button>
  </form>
</aside>
<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
