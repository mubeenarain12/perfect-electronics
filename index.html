<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfect Electronics & Solar System | Tando Adam</title>
<meta name="description" content="Solar panels, inverters, batteries and electronics in Tando Adam. Order on WhatsApp.">
<style>
:root{--navy:#0f172a;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--accent:#f59e0b;--accent-d:#d97706;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
section{padding:40px 0;scroll-margin-top:80px}
h2.title{font-size:24px;color:var(--navy);margin-bottom:20px}

.topbar{background:var(--navy);color:#e2e8f0;font-size:13px}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;padding-top:8px;padding-bottom:8px}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.head{display:flex;align-items:center;gap:16px;padding:12px 0}
.logo{font-weight:800;font-size:19px;color:var(--navy);line-height:1.15}
.logo span{display:block;font-size:11px;font-weight:700;color:var(--accent-d);letter-spacing:.08em;text-transform:uppercase}
.search{flex:1;max-width:520px}
.search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #fde68a}
.cartbtn{margin-left:auto;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;white-space:nowrap}
.cartbtn b{background:var(--accent);color:var(--navy);border-radius:999px;padding:1px 8px;margin-left:6px;font-size:12px}
nav{background:#fff;border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto}
nav a{padding:12px 14px;font-size:14px;font-weight:600;white-space:nowrap}
nav a:hover{color:var(--accent-d)}

.hero{background:linear-gradient(135deg,var(--navy),#1e3a5f);color:#fff;padding:56px 0}
.hero h1{font-size:clamp(26px,5vw,42px);line-height:1.15;max-width:660px}
.hero p{margin-top:12px;color:#cbd5e1;max-width:560px}
.btns{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 22px;font-weight:700;cursor:pointer;font-size:15px}
.btn-accent{background:var(--accent);color:var(--navy)}
.btn-accent:hover{background:var(--accent-d)}
.btn-wa{background:var(--green);color:#fff}

.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.cat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 12px;text-align:center;font-weight:700;color:var(--navy);cursor:pointer;transition:.15s}
.cat:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,23,42,.08)}
.cat i{display:block;font-style:normal;font-size:34px;margin-bottom:8px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.group h3{font-size:19px;color:var(--navy);margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--accent);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card .img{aspect-ratio:1/1;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:56px}
.card .img img{width:100%;height:100%;object-fit:contain;background:#fff}
.card .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.brand{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-d)}
.pname{font-size:15px;font-weight:600;color:var(--navy);line-height:1.35}
.price{margin-top:auto;font-weight:800;font-size:17px;color:var(--navy)}
.price s{font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.price.ask{font-size:14px;font-weight:600;color:var(--muted)}
.sale{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.add{width:100%;margin-top:8px;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}
.add:hover{background:var(--accent-d)}
.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}

.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.feat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.feat b{display:block;color:var(--navy);margin-bottom:4px}
.feat p{font-size:14px;color:var(--muted)}

.about{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.about p{max-width:780px;margin-bottom:12px}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.box h4{color:var(--navy);margin-bottom:6px}
.box a.link{color:var(--accent-d);font-weight:700}
footer{background:var(--navy);color:#94a3b8;text-align:center;padding:24px 16px;font-size:14px}
.wafab{position:fixed;right:16px;bottom:16px;background:var(--green);color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:40}

.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;z-index:50}
.ov.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:#fff;z-index:60;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
.drawer.show{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy)}
.dh button{border:0;background:none;font-size:26px;cursor:pointer}
.items{flex:1;overflow:auto;padding:12px 16px}
.item{display:flex;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
.rm{border:0;background:none;color:var(--red);cursor:pointer;font-size:13px}
.df{padding:16px;border-top:1px solid var(--line);display:grid;gap:8px}
.df input,.df textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px}
.total{
